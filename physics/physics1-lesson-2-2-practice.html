<style>

.submitcard{text-align:center;padding:28px 22px}
.submitcard p{color:var(--muted)}

/* dialog */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:24px 26px;max-width:440px;width:calc(100% - 32px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,15,25,.55)}
dialog h3{margin-top:0}

dialog .err{color:var(--bad);font-size:.88rem;min-height:1.2em}
dialog .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}

/* results */
#results{display:none}
body.show-results #results{display:block}
body.show-results #worksheet{display:none}
.res-head{display:flex;flex-wrap:wrap;gap:16px 30px;justify-content:space-between;align-items:center}
.res-head h2{margin:0;font-size:1.8rem}
.res-head .sub{color:var(--muted)}
.scorebox{text-align:center;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 26px}
.scorebox b{display:block;font-family:Georgia,serif;font-size:2.4rem;line-height:1.1}
.scorebox span{color:var(--muted);font-size:.9rem}
.resbar{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin:16px 0 4px}
.resbar i{display:block;height:100%;background:var(--good)}
.stats{display:flex;gap:10px 22px;flex-wrap:wrap;font-size:.92rem;color:var(--muted);margin-bottom:6px}
.stats b{color:var(--ink)}
table.res{width:100%;border-collapse:collapse;font-size:.95rem}
table.res th,table.res td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.res th{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tag{display:inline-block;font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.tag.ok{background:var(--good-soft);color:var(--good)}
.tag.fail{background:var(--bad-soft);color:var(--bad)}

.tag.prog{background:var(--warm-soft);color:var(--warm)}
.written{white-space:pre-wrap;color:var(--ink);font-size:.9rem;background:var(--surface-2);border-radius:6px;padding:6px 8px;margin-top:4px}
.res-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}

@media print{
  header.top .meta,nav.tabs,.res-actions,.lessonbar .overall{display:none!important}
  body{background:#fff}
  .card{box-shadow:none;break-inside:avoid}
}

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fr=(n,d)=>`<span class="frac"><span>${n}</span><span>${d}</span></span>`;
const ms2='m/s<sup>2</sup>';
const MAX=3;
const KEY='lia-physics1-lesson-2-2-practice';

/* Saving: try localStorage, sessionStorage and window.name together so answers survive a refresh
   even when the browser (or an embedding page) blocks one of them. The newest copy wins on load. */
const NAMEPFX='LIA22:';
let state={}, storeMode='none';
function readStores(){
  const out=[];
  try{ const v=localStorage.getItem(KEY); if(v) out.push(['local',JSON.parse(v)]); }catch(e){}
  try{ const v=sessionStorage.getItem(KEY); if(v) out.push(['session',JSON.parse(v)]); }catch(e){}
  try{ if(window.name.indexOf(NAMEPFX)===0) out.push(['tab',JSON.parse(window.name.slice(NAMEPFX.length))]); }catch(e){}
  return out;
}
(function(){
  const found=readStores().filter(x=>x[1]&&typeof x[1]==='object').sort((a,b)=>(b[1]._ts||0)-(a[1]._ts||0));
  if(found.length) state=found[0][1];
})();
function save(){
  state._ts=Date.now();
  const json=JSON.stringify(state); let mode='none';
  try{ localStorage.setItem(KEY,json); if(localStorage.getItem(KEY)===json) mode='local'; }catch(e){}
  try{ sessionStorage.setItem(KEY,json); if(mode==='none') mode='session'; }catch(e){}
  try{ window.name=NAMEPFX+json; if(mode==='none') mode='tab'; }catch(e){}
  storeMode=mode; showSaveStatus();
}
function clearSaved(){
  try{ localStorage.removeItem(KEY); }catch(e){}
  try{ sessionStorage.removeItem(KEY); }catch(e){}
  try{ window.name=''; }catch(e){}
}
function showSaveStatus(){
  const el=document.getElementById('saveStatus'); if(!el) return;
  if(storeMode==='local'){ el.textContent='💾 Progress saved on this device'; el.style.color='var(--good)'; }
  else if(storeMode==='none'){ el.textContent='⚠ Saving is blocked in this browser'; el.style.color='var(--bad)'; }
  else{ el.textContent='⚠ Saved for this tab only — keep this tab open'; el.style.color='var(--warm)'; }
}
window.addEventListener('pagehide',()=>save());
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') save(); });

/* ---------- item definitions (answers never displayed) ---------- */
const ITEMS={};
const num=(id,ans,unit,hint,label,o={})=>{ ITEMS[id]=Object.assign({id,type:'num',ans,unit,hint,label},o); };
const sel=(id,options,ans,hint,label)=>{ ITEMS[id]={id,type:'sel',options,ans,hint,label}; };
const txt=(id,concepts,need,hint,label)=>{ ITEMS[id]={id,type:'txt',concepts,need,hint,label}; };
const MOTION=['Speeding up','Slowing down','Constant velocity'];
const YESNO=['Yes','No'];

/* Activity 1 */
num('a1_aA',2,ms2,'Slope = rise ÷ run. Use the velocities at the start and end of the segment.');
num('a1_aB',0,ms2,'Is the velocity changing at all during this segment?');
num('a1_aC',-2,ms2,'Use v<sub>f</sub> − v<sub>i</sub> over t<sub>f</sub> − t<sub>i</sub>. Pay attention to whether velocity rises or falls.');
sel('a1_dA',MOTION,0,'Compare the velocity at the beginning and end of the segment.');
sel('a1_dB',MOTION,2,'Compare the velocity at the beginning and end of the segment.');
sel('a1_dC',MOTION,1,'Compare the velocity at the beginning and end of the segment.');
num('a1_xA',16,'m','The area under segment A is a triangle: ½ × base × height.');
num('a1_xB',32,'m','The area under a flat line is a rectangle: base × height.');
num('a1_xC',16,'m','Use the area under the curve, or ½(v<sub>i</sub> + v<sub>f</sub>)Δt.');
num('a1_xT',64,'m','Total displacement is the sum of all the segment displacements.');
txt('a1_q5',[
  /same (magnitude|size|amount|value|number)|equal|identical|both (are |have |had )?(2|two)|2 ?m\/s|magnitudes? (is|are) (the )?same|same rate|same acceleration/,
  /opposite|negative|reverse|different (direction|sign)|positive.*negative|negative.*positive|one is (positive|negative)/,
  /speed(s|ing)? up|slow(s|ing)? down|increas|decreas|gain|los(e|es|ing)|decelerat|faster|slower/
],3,'Think about both the size of each slope and its sign. What does each sign say about the motion?');
num('a1_aD',0,ms2,'Is the line flat or sloped?');
num('a1_aE',0.8,ms2,'Slope = Δv ÷ Δt. Read v and t at each end of the segment from the graph.');
num('a1_aF',1.2,ms2,'Slope = Δv ÷ Δt. Read v and t at each end of the segment from the graph.');
num('a1_xD',20,'m','A flat line makes a rectangle: v × Δt.');
num('a1_xE',30,'m','Use ½(v<sub>i</sub> + v<sub>f</sub>)Δt, or a rectangle plus a triangle.');
num('a1_xF',55,'m','Use ½(v<sub>i</sub> + v<sub>f</sub>)Δt, or a rectangle plus a triangle.');
num('a1_xT2',105,'m','Add the displacements of D, E, and F (t = 0 s to 15 s).');
txt('a1_q9',[
  /greater|larger|more|bigger|higher|exceed|105|not equal|different/,
  /area|longer|more time|15 ?s|faster|higher (velocity|speed)|never (slow|decreas)|keeps? (speed|accelerat)|speeds? up|accelerat|bigger area|larger area/
],2,'Compare the two totals, then compare the shapes of the graphs (time covered and how the area builds up).');
txt('a1_q10',[
  /below|cross|negative (velocity|values?)|under the (time )?axis|x-?axis|time axis|dips?|drops?/,
  /opposite|backward|reverse|negative (direction|displacement)|back(wards)?|return|toward the start|other direction/
],2,'Where would the line be relative to the time axis? What does the sign of velocity tell you about direction?');

/* Practice problems: time and acceleration */
num('p1',5.0,'s','Δt = (v<sub>f</sub> − v<sub>i</sub>) ÷ a. What is v<sub>i</sub> when starting from rest?');
num('p2',5.0,'s','A “complete stop” means v<sub>f</sub> = 0. Watch the signs.');
num('p3',0.06,ms2,'a = (v<sub>f</sub> − v<sub>i</sub>) ÷ Δt.');
num('p4',-0.20,ms2,'Use Δv = v<sub>f</sub> − v<sub>i</sub>. Slowing down while moving forward gives a negative value.');
num('p5',6.07,'s','Rearrange to Δt = (v<sub>f</sub> − v<sub>i</sub>) ÷ a.');
num('p6a',4.6,'m/s','Use v<sub>f</sub> = v<sub>i</sub> + aΔt and keep the sign of a.');
sel('p6b',YESNO,0,'Is your final velocity positive or negative?');
txt('p7',[
  /slow|decreas|reduc|dimin|less|drop|lower|smaller|losing|decelerat/
],1,'Think about the direction of the acceleration compared with the direction of motion. What happens to the speed?');

/* Displacement and final velocity */
num('d1',20.7,'m','Use Equation 1: Δx = ½(v<sub>i</sub> + v<sub>f</sub>)Δt. What is v<sub>i</sub>?');
num('d2',102,'m','Use Equation 1: Δx = ½(v<sub>i</sub> + v<sub>f</sub>)Δt.');
num('d3',5.0,'s','Rearrange Equation 1 to solve for Δt.');
num('d4',201.6,'m','Use Equation 3 with v<sub>i</sub> = 0 (the plane starts at rest).');
num('d5',2880,'m','Convert minutes to seconds first, then use Equation 3.');

/* ---------- parsing & checking ---------- */
function parseNum(raw){
  let t=String(raw).trim().replace(/[−–—]/g,'-').replace(/\s+/g,' ');
  const m=t.match(/^([+-]?)\s*(\d[\d,]*\.?\d*|\.\d+)(?:\s*[eE]([+-]?\d+))?/);
  if(!m) return null;
  let n=m[2];
  if(/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(n)) n=n.replace(/,/g,'');
  else n=n.replace(',','.');
  let v=parseFloat(n); if(!isFinite(v)) return null;
  if(m[3]) v*=Math.pow(10,parseInt(m[3],10));
  return m[1]==='-'?-v:v;
}
const REL_TOL=0.015;   // 1.5% tolerance covers normal rounding of answers
function checkNum(it,raw){
  const v=parseNum(raw);
  if(v===null) return {invalid:'Enter a number (you may include units).'};
  const a=it.ans, tol=a===0?0.005:Math.abs(a)*(it.tol||REL_TOL);
  if(Math.abs(v-a)<=tol+1e-9) return {ok:true};
  if(a!==0 && Math.abs(v+a)<=tol) return {msg:'Close — check the sign (direction) of your answer.'};
  if(a!==0 && Math.abs(v-a)/Math.abs(a)<=0.08) return {msg:'Very close — check your arithmetic and rounding.'};
  return {msg:'Not quite — re-read the problem and check your setup, units and signs.'};
}
function checkTxt(it,raw){
  const t=raw.trim();
  if(t.length<15) return {invalid:'Write a complete explanation (at least a full sentence) before checking.'};
  const low=t.toLowerCase();
  const got=it.concepts.filter(re=>re.test(low)).length;
  if(got>=it.need) return {ok:true};
  return {msg:`Your explanation covers ${Math.min(got,it.need-1)} of the ${it.need} key ideas needed. Add more detail and try again.`};
}

/* ---------- build UI ---------- */
const order=[];            // item ids in DOM order
const sheetOf={};          // id -> sheet
const tabs=$('#tabs'), panels=$('#panels');

SHEETS.forEach((sh,i)=>{
  const b=document.createElement('button'); b.type='button'; b.role='tab'; b.textContent=sh.tab; b.dataset.id=sh.id;
  b.setAttribute('aria-selected',i===0?'true':'false'); tabs.appendChild(b);
  const p=document.createElement('section'); p.className='panel'+(i===0?' active':''); p.id='panel-'+sh.id; p.innerHTML=sh.html;
  panels.appendChild(p);
  $$('[data-graph]',p).forEach(drawGraph);
  $$('[data-slot]',p).forEach(el=>{
    const id=el.dataset.slot, it=ITEMS[id];
    if(!it.label && sh.labels && sh.labels[id]) it.label=sh.labels[id];
    order.push(id); sheetOf[id]=sh;
    el.replaceWith(buildItem(it));
  });
  const nav=document.createElement('div'); nav.className='card submitcard';
  nav.innerHTML=i<SHEETS.length-1
    ? `<button class="btn" type="button" data-go="${SHEETS[i+1].id}">Next worksheet: ${esc(SHEETS[i+1].tab)} →</button>`
    : `<h3>Finished?</h3><p>Check that you have worked through every question, then submit to see your results.</p><button class="btn big" type="button" data-submit>SUBMIT</button>`;
  p.appendChild(nav);
});

function show(id){
  $$('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.id===id?'true':'false'));
  $$('section.panel').forEach(p=>p.classList.toggle('active',p.id==='panel-'+id));
  state._tab=id; save();
  window.scrollTo({top:0});
}
tabs.addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) show(b.dataset.id); });
panels.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g) show(g.dataset.go);
  if(e.target.closest('[data-submit]')) openSubmit();
});

function buildItem(it){
  const wrap=document.createElement('div'); wrap.className='item'; wrap.id='it-'+it.id;
  let field;
  if(it.type==='num'){
    field=`<input type="text" inputmode="text" autocomplete="off" spellcheck="false" aria-label="${esc(it.label||'Answer')}" placeholder="Answer">`+(it.unit?`<span class="unit">${it.unit}</span>`:'');
  }else if(it.type==='sel'){
    field=`<select aria-label="${esc(it.label||'Choose')}"><option value="">— choose —</option>${it.options.map((o,i)=>`<option value="${i}">${esc(o)}</option>`).join('')}</select>`;
  }else{
    field=`<textarea aria-label="Your explanation" placeholder="Type your explanation here…" spellcheck="true"></textarea>`;
  }
  wrap.innerHTML=(it.label?`<div class="lbl">${esc(it.label)}</div>`:'')+
    `<div class="row">${field}<button class="btn" type="button">Check</button><span class="dots" aria-hidden="true"><i></i><i></i><i></i><span></span></span></div><div class="fb" aria-live="polite"></div>`;
  const input=$('input,select,textarea',wrap), btn=$('button',wrap);
  btn.addEventListener('click',()=>attempt(it,wrap));
  const draft=()=>{ const st=state[it.id]||(state[it.id]={n:0,done:null,val:''}); if(!st.done){ st.val=input.value; save(); } };
  input.addEventListener('input',draft); input.addEventListener('change',draft);
  if(it.type==='num') input.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); attempt(it,wrap); } });
  paint(it,wrap);
  return wrap;
}

function attempt(it,wrap){
  const st=state[it.id]||(state[it.id]={n:0,done:null,val:''});
  if(st.done) return;
  const input=$('input,select,textarea',wrap), fb=$('.fb',wrap);
  const raw=input.value;
  let res;
  if(it.type==='sel'){
    if(raw===''){ res={invalid:'Choose an answer first.'}; }
    else res=(+raw===it.ans)?{ok:true}:{msg:'Not quite — look at the problem again.'};
  }else if(it.type==='num') res=checkNum(it,raw);
  else res=checkTxt(it,raw);
  if(res.invalid){ fb.className='fb show warn'; fb.textContent=res.invalid; return; }   // does not use up an attempt
  st.n++; st.val=raw;
  if(res.ok){ st.done='ok'; st.okAt=st.n; }
  else{
    st.last=res.msg;
    if(st.n>=MAX) st.done='fail';
  }
  save(); paint(it,wrap); updateProgress();
}

function paint(it,wrap){
  const st=state[it.id]||{n:0,done:null,val:''};
  const input=$('input,select,textarea',wrap), btn=$('button',wrap), fb=$('.fb',wrap), dots=$$('.dots i',wrap), dl=$('.dots span',wrap);
  if(st.val!==undefined && input.value==='') input.value=st.val||'';
  wrap.classList.toggle('ok',st.done==='ok'); wrap.classList.toggle('fail',st.done==='fail');
  dots.forEach((d,i)=>{ d.className=''; if(i<st.n) d.className=(st.done==='ok'&&i===st.n-1)?'good':'bad'; });
  dl.textContent=st.done?'':`Attempt ${Math.min(st.n+1,MAX)} of ${MAX}`;
  const locked=!!st.done; input.disabled=locked; btn.disabled=locked;
  if(st.done==='ok'){ fb.className='fb show good'; fb.innerHTML=`✓ Correct!${st.okAt>1?` (attempt ${st.okAt} of ${MAX})`:''}`; }
  else if(st.done==='fail'){ fb.className='fb show bad'; fb.innerHTML=`✗ You have used all 3 attempts.<small>Review the lesson and ask your teacher to go over this one with you.</small>`; }
  else if(st.n>0){ fb.className='fb show bad'; fb.innerHTML=`✗ ${esc(st.last)} ${MAX-st.n} attempt${MAX-st.n===1?'':'s'} left.<small>💡 Hint: ${it.hint}</small>`; }
  else { fb.className='fb'; fb.textContent=''; }
}

function updateProgress(){
  const total=order.length, done=order.filter(id=>state[id]&&state[id].done).length;
  $('#overallText').textContent=`${done} of ${total} answers finished`;
  $('#overallBar').style.width=(done/total*100)+'%';
}
updateProgress(); if(Object.keys(state).length) save(); else { try{ localStorage.setItem(KEY+'-t','1'); localStorage.removeItem(KEY+'-t'); storeMode='local'; }catch(e){ storeMode='tab'; } showSaveStatus(); }
if(state._tab && SHEETS.some(x=>x.id===state._tab)){ show(state._tab); window.scrollTo({top:0}); }

/* ---------- submit, name, results ---------- */
const dlg=$('#nameDialog'), nameIn=$('#studentName'), nameErr=$('#nameErr');
function openSubmit(){
  const open=order.filter(id=>!(state[id]&&state[id].done)).length;
  const w=$('#unansweredWarn');
  if(open){ w.hidden=false; w.textContent=`You still have ${open} question${open===1?'':'s'} that ${open===1?'isn’t':'aren’t'} finished. You can keep working, or submit now.`; }
  else w.hidden=true;
  nameIn.value=state._name||''; nameErr.textContent='';
  let who=''; try{ who=(window.LiaSync&&LiaSync.live&&LiaSync.name())||''; }catch(e){}   // registered name from the sign-in
  nameIn.readOnly=!!who; if(who) nameIn.value=who;
  const nl=document.querySelector('label[for="studentName"]'); if(nl) nl.textContent=who?'Your results will be shown under the name from your sign-in:':'Enter your full name to see your results:';
  if(dlg.showModal) dlg.showModal(); else dlg.setAttribute('open','');
  setTimeout(()=>nameIn.focus(),30);
}
$('#submitTop').addEventListener('click',openSubmit);
$('#nameCancel').addEventListener('click',()=>dlg.close());
$('#nameForm').addEventListener('submit',e=>{
  e.preventDefault();
  const n=nameIn.value.trim().replace(/\s+/g,' ');
  if(n.length<2){ nameErr.textContent='Please type your name.'; nameIn.focus(); return; }
  state._name=n; state._when=new Date().toISOString(); state._view='results'; save();
  dlg.close(); renderResults();
});

function itemLabel(id){ const it=ITEMS[id]; return it.label||''; }
function answerText(it,st){
  if(!st||st.val===''||st.val===undefined) return '';
  if(it.type==='sel') return it.options[+st.val]||'';
  return st.val;
}
const QNAMES={ // human-readable question names for the results table
  a1_aA:'Part 1 · Acceleration, Segment A',a1_aB:'Part 1 · Acceleration, Segment B',a1_aC:'Part 1 · Acceleration, Segment C',
  a1_dA:'Part 1 · Description, Segment A',a1_dB:'Part 1 · Description, Segment B',a1_dC:'Part 1 · Description, Segment C',
  a1_xA:'Q1 · Segment A displacement',a1_xB:'Q2 · Segment B displacement',a1_xC:'Q3 · Segment C displacement',a1_xT:'Q4 · Total displacement',
  a1_q5:'Q5 · Compare accelerations A and C',a1_aD:'Q6 · Acceleration, Segment D',a1_aE:'Q6 · Acceleration, Segment E',a1_aF:'Q6 · Acceleration, Segment F',
  a1_xD:'Q7 · Displacement, Segment D',a1_xE:'Q7 · Displacement, Segment E',a1_xF:'Q7 · Displacement, Segment F',a1_xT2:'Q8 · Total displacement (0–15 s)',
  a1_q9:'Q9 · Compare with first vehicle',a1_q10:'Q10 · Negative velocity / negative area',
  p1:'Problem 1',p2:'Problem 2',p3:'Problem 3',p4:'Problem 4',p5:'Problem 5',p6a:'Problem 6 · Final velocity',p6b:'Problem 6 · Still moving positive?',p7:'Problem 7 · Sign conventions',
  d1:'Problem 1',d2:'Problem 2',d3:'Problem 3',d4:'Problem 4',d5:'Problem 5',d6a:'Problem 6a',d6b:'Problem 6b',d7a:'Problem 7 · Final velocity',d7b:'Problem 7 · Displacement',
  d8a:'Problem 8a',d8b:'Problem 8b · Stopping distance',d8c:'Problem 8b · Is the student correct?',
  m1a:'Problem 1a',m1b:'Problem 1b',m2a:'Problem 2a',m2b:'Problem 2b',m3a:'Problem 3a',m3b:'Problem 3b · Stopping distance',m3c:'Problem 3b · Stops before obstacle?',m4:'Problem 4 · Critique the reasoning'
};
function renderResults(){
  const total=order.length;
  const okN=order.filter(id=>state[id]&&state[id].done==='ok').length;
  const pct=Math.round(okN/total*100);
  const h=`<div class="card" style="text-align:center;padding:40px 22px;max-width:520px;margin:30px auto">
    <h2 style="font-size:2rem;margin-bottom:.2em">${esc(state._name)}</h2>
    <div class="scorebox" style="display:inline-block;margin:14px 0 18px;padding:18px 44px"><b style="font-size:3.6rem">${pct}%</b><span>correct answers</span></div>
    <div class="res-actions" style="justify-content:center"><button class="btn" type="button" id="resPrint">Print / Save as PDF</button><button class="btn ghost" type="button" id="resBack">← Back to the worksheets</button><button class="btn ghost" type="button" id="resReset">Start over (new student)</button></div></div>`;
  $('#resultsInner').innerHTML=h;
  document.body.classList.add('show-results');
  window.scrollTo({top:0});
  $('#resPrint').onclick=()=>window.print();
  $('#resBack').onclick=()=>{ state._view=''; save(); document.body.classList.remove('show-results'); window.scrollTo({top:0}); };
  $('#resReset').onclick=()=>{
    if(confirm('Erase all answers and attempts on this computer and start over?')){
      clearSaved();
      location.reload();
    }
  };
}
if(state._view==='results' && state._name) renderResults();
})();
</script>
